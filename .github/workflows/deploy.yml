name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Lint → Typecheck → Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate Prisma Client
        working-directory: app
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare server
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "apt-get install -y rsync && mkdir -p /opt/aidash/app"

      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            --exclude='*.db' \
            -e "ssh -p ${{ secrets.SERVER_PORT }}" \
            app/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/aidash/app/

      - name: Deploy on server
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "DATABASE_URL='${{ secrets.DATABASE_URL }}' \
             AUTH_SECRET='${{ secrets.AUTH_SECRET }}' \
             DEPLOY_DOMAIN='${{ secrets.DEPLOY_DOMAIN }}' \
             CERTBOT_EMAIL='${{ secrets.CERTBOT_EMAIL }}' \
             bash /opt/aidash/app/scripts/deploy-remote.sh"
