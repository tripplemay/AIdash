<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的神奇搭档课程包 — AI Dash</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    body { padding: 20px; }

    /* ── 课程信息区 ── */
    .detail-hero {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      padding: 20px;
      background: linear-gradient(180deg, rgba(238,243,255,0.95), rgba(255,255,255,0.92));
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
    }
    @media (max-width: 700px) { .detail-hero { grid-template-columns: 1fr; } }

    .detail-cover {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #dde6ff;
      background: #eef3ff;
      min-height: 240px;
    }
    .detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 10px;
      margin-top: 16px;
    }
    @media (max-width: 600px) { .detail-meta-grid { grid-template-columns: repeat(2,1fr); } }

    .meta-tile {
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }

    /* ── 课次列表 ── */
    .lesson-row {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      background: #fbfcff;
      border: 1px solid var(--line);
    }
    .lesson-num { font-size: 14px; font-weight: 700; color: #6177aa; }
    .lesson-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .lesson-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .lesson-output { font-size: 13px; color: var(--muted); }

    @media (max-width: 600px) {
      .lesson-row { grid-template-columns: 1fr; }
      .lesson-num { display: none; }
    }
  </style>
</head>
<body>
  <div class="page-wrap" style="padding:0;">
    <div class="page-shell">
      <div class="page-shell-inner">
        <div class="shell2">

          <!-- ── 左侧侧栏 ── -->
          <aside class="sidebar">
            <div class="sidebar-logo">
              <div class="logo-mark"></div>
              <div class="logo-text">AI Dash</div>
            </div>

            <nav class="menu" style="padding-top:18px;">
              <a href="list.html" class="menu-item active">课程包详情</a>
              <a href="#" class="menu-item">课次列表</a>
            </nav>

            <div class="sidebar-copy">教师授课系统</div>
          </aside>

          <!-- ── 主区 ── -->
          <main class="main" style="padding:20px 24px 28px;">

            <!-- 面包屑 -->
            <div class="crumb">
              <a href="list.html">返回课程包列表</a>
              <span> / 8–12 岁 / L1</span>
            </div>

            <!-- 课程包信息卡 -->
            <div class="detail-hero">
              <!-- 主图：严格使用最终确认版 -->
              <div class="detail-cover">
                <img
                  src="assets/images/my-magical-partner-cover.png"
                  alt="我的神奇搭档课程包主图：蓝色大机器人、绿色小机器人、男孩握手互动，左上带样板课标识"
                />
              </div>
              <!-- 课程包文字信息 -->
              <div>
                <span class="pill">样板课</span>
                <div style="font-size:28px; font-weight:800; margin:10px 0 8px;">我的神奇搭档课程包</div>
                <div class="muted small" style="line-height:1.8; margin-bottom:16px;">
                  面向 8–12 岁学生的 AI 创作课程包，帮助学生通过 AI 互动创作「我的神奇搭档介绍页」，培养 AI 协作思维与创意表达能力。
                </div>
                <div class="detail-meta-grid">
                  <div class="meta-tile">
                    <div class="small muted" style="margin-bottom:4px;">适用年龄段</div>
                    <div style="font-size:17px; font-weight:800;">8–12 岁</div>
                  </div>
                  <div class="meta-tile">
                    <div class="small muted" style="margin-bottom:4px;">级别</div>
                    <div style="font-size:17px; font-weight:800;">L1</div>
                  </div>
                  <div class="meta-tile">
                    <div class="small muted" style="margin-bottom:4px;">状态</div>
                    <div style="font-size:17px; font-weight:800; color:#228654;">已发布</div>
                  </div>
                  <div class="meta-tile">
                    <div class="small muted" style="margin-bottom:4px;">接入方式</div>
                    <div style="font-size:14px; font-weight:800;">标准单课成品包</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 课次列表 -->
            <div class="card-flat" style="padding:18px; border-radius:22px;">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
                <div>
                  <div style="font-size:18px; font-weight:800; margin-bottom:4px;">课次列表</div>
                  <div class="small muted">点击"进入本课"直接打开已确认原型内容</div>
                </div>
              </div>
              <div style="display:grid; gap:10px;">
                <!-- 第 1 课 -->
                <div class="lesson-row">
                  <div class="lesson-num">第 1 课</div>
                  <div>
                    <div class="lesson-title">我的神奇搭档</div>
                    <div class="lesson-pills">
                      <span class="pill">45 分钟</span>
                      <span class="pill">4–6 人线下小班</span>
                      <span class="pill">3 个 AI 回合</span>
                      <span class="pill ok">已按规范接入</span>
                    </div>
                    <div class="lesson-output">本课成果：《我的神奇搭档介绍页》</div>
                  </div>
                  <div>
                    <button
                      class="btn"
                      onclick="window.open('course-packages/my-magical-partner/lessons/lesson-01/index.html','_blank')"
                    >进入本课</button>
                  </div>
                </div>
              </div>
            </div>

          </main>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
