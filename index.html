<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Dash — 教师授课系统</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

    .login-shell {
      width: 100%;
      max-width: 1280px;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(244,247,255,0.97), rgba(238,242,255,0.97));
      border: 1px solid var(--line);
      box-shadow: 0 24px 64px rgba(112,134,210,0.14);
      overflow: hidden;
      position: relative;
    }
    .login-shell::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 78% 16%, rgba(161,196,255,0.18), transparent 18%),
        radial-gradient(circle at 22% 80%, rgba(186,201,255,0.18), transparent 24%),
        linear-gradient(135deg, rgba(132,180,255,0.06), rgba(174,139,255,0.07));
      pointer-events: none;
    }
    .login-grid {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 0;
      align-items: stretch;
      min-height: 640px;
    }

    /* ── 左侧品牌区 ── */
    .brand-side {
      padding: 48px 40px 40px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .brand-logo-mark {
      width: 48px; height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, #7e95ff, #9ad8ff);
      box-shadow: 0 10px 24px rgba(126,149,255,.22);
    }
    .brand-logo-name {
      font-size: 36px;
      font-weight: 800;
      color: var(--text);
    }
    .brand-headline {
      font-size: 58px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
      margin-bottom: 14px;
    }
    .brand-sub {
      font-size: 24px;
      color: #6f80bb;
      font-weight: 500;
      margin-bottom: 18px;
    }
    .brand-desc {
      color: #7587b5;
      line-height: 1.9;
      font-size: 15px;
      max-width: 480px;
      margin-bottom: 28px;
    }
    .brand-features {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .brand-feature-card {
      background: rgba(255,255,255,0.64);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 8px 24px rgba(109,131,199,0.08);
    }
    .brand-feature-card div {
      color: #5f73b0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.9;
    }
    .brand-visual {
      width: 280px;
      max-width: 100%;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 16px 36px rgba(125,146,214,0.12);
    }

    /* ── 右侧登录区 ── */
    .login-side {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 40px 44px 40px 24px;
      border-left: 1px solid rgba(228,234,255,0.6);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.76);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 36px 32px 28px 32px;
      box-shadow: 0 16px 36px rgba(125,146,214,0.12);
    }
    .login-title { font-size: 30px; font-weight: 800; margin-bottom: 6px; }
    .login-sub   { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
    .form-label  { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .form-group  { margin-bottom: 16px; }
    .login-meta {
      display: flex;
      justify-content: space-between;
      margin: 10px 0 18px;
      font-size: 13px;
      color: var(--muted);
    }
    .login-meta a { color: var(--muted); text-decoration: none; }
    .login-meta a:hover { color: var(--brand); }
    .login-btn {
      width: 100%; height: 52px;
      font-size: 16px;
      border: none; border-radius: 14px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(90deg, #6f86ff, #61d1ff);
      box-shadow: 0 10px 22px rgba(111,134,255,.18);
      font-weight: 800;
      transition: opacity 0.15s;
      margin-bottom: 14px;
    }
    .login-btn:hover { opacity: 0.88; }
    .login-divider {
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; color: var(--muted); margin-bottom: 12px;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--line);
    }
    .alt-logins { display: flex; gap: 10px; }
    .alt-login-btn {
      flex: 1;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.78);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .alt-login-btn:hover { background: rgba(255,255,255,0.96); }
    .alt-login-btn.wechat {
      background: rgba(238,252,244,0.82);
      border-color: #d9f0df;
      color: #4f8d5a;
    }

    @media (max-width: 800px) {
      .login-grid { grid-template-columns: 1fr; }
      .brand-side { padding: 32px 24px 24px 24px; }
      .brand-headline { font-size: 36px; }
      .login-side { padding: 0 24px 32px; justify-content: center; border-left: none; }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-grid">

      <!-- 左侧品牌区 -->
      <div class="brand-side">
        <div class="brand-logo">
          <div class="brand-logo-mark"></div>
          <div class="brand-logo-name">AI Dash</div>
        </div>
        <div class="brand-headline">教师授课系统</div>
        <div class="brand-sub">开启智能备课新体验</div>
        <div class="brand-desc">
          借助 AI 智备课、互动课堂指导与智能复盘，帮助老师更高效地进入课程、管理课包与组织授课流程。
        </div>
        <div class="brand-features">
          <div class="brand-feature-card">
            <div>AI 智能备课</div>
            <div>互动课堂指导</div>
            <div>AI 复盘助力提升</div>
          </div>
          <img
            src="assets/images/login-brand-reference.png"
            alt="首页参考图"
            class="brand-visual"
          />
        </div>
      </div>

      <!-- 右侧登录区 -->
      <div class="login-side">
        <div class="login-card">
          <div class="login-title">欢迎回来</div>
          <div class="login-sub">登录教师授课系统，进入课程包与授课流程</div>

          <div class="form-group">
            <div class="form-label">账号</div>
            <input class="input" type="text" placeholder="请输入账号" />
          </div>
          <div class="form-group">
            <div class="form-label">密码</div>
            <input class="input" type="password" placeholder="请输入密码" />
          </div>

          <div class="login-meta">
            <a href="#">验证码登录</a>
            <a href="#">忘记密码？</a>
          </div>

          <button class="login-btn" onclick="window.location.href='list.html'">登录</button>

          <div class="login-divider">其他登录方式</div>
          <div class="alt-logins">
            <button class="alt-login-btn">企业微信登录</button>
            <button class="alt-login-btn wechat">微信登录</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
