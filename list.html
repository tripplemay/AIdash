<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课程包列表 — AI Dash</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    body { padding: 20px; }

    /* ── 卡片网格 ── */
    .pkg-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    @media (max-width: 1100px) { .pkg-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 700px)  { .pkg-grid { grid-template-columns: 1fr; } }

    .pkg-card {
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255,255,255,0.82);
      border: 1px solid var(--line);
      box-shadow: none;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .pkg-card:hover {
      box-shadow: 0 12px 32px rgba(112,134,210,0.14);
      transform: translateY(-2px);
    }
    .pkg-cover {
      height: 200px;
      overflow: hidden;
      background: #edf5ff;
      position: relative;
    }
    .pkg-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pkg-cover-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 13px;
    }
    .pkg-body { padding: 16px 18px 16px 18px; }
    .pkg-title { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
    .pkg-meta  { display: grid; gap: 6px; color: #6b7daf; font-size: 14px; margin-bottom: 16px; }
    .pkg-enter-btn {
      width: 100%; height: 44px;
      margin-bottom: 10px;
    }
    .pkg-tags { font-size: 12px; color: var(--muted); }

    /* ── 搜索栏 ── */
    .search-bar {
      height: 48px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(240,244,255,0.76);
      padding: 0 16px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      width: 100%;
      max-width: 440px;
      transition: border-color 0.15s;
    }
    .search-bar:focus { border-color: var(--brand); }

    /* ── 分页 ── */
    .pagination {
      height: 68px;
      border-top: 1px solid #e7ecff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #91a0c6;
    }
    .page-num {
      width: 46px; height: 38px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: #eef3ff;
      font-weight: 800;
      font-size: 14px;
      color: var(--brand);
      cursor: pointer;
      display: grid; place-items: center;
    }
  </style>
</head>
<body>
  <div class="page-wrap" style="padding:0;">
    <div class="page-shell">
      <div class="page-shell-inner">
        <div class="shell2">

          <!-- ── 左侧侧栏 ── -->
          <aside class="sidebar">
            <div class="sidebar-logo">
              <div class="logo-mark"></div>
              <div class="logo-text">AI Dash</div>
            </div>

            <div class="user-card-wrap">
              <div class="user-card">
                <div class="avatar"></div>
                <div>
                  <div class="small muted" style="margin-bottom:2px;">欢迎回来</div>
                  <div style="font-size:16px; font-weight:800;">张老师</div>
                </div>
              </div>
            </div>

            <nav class="menu">
              <a href="list.html" class="menu-item active">课程包列表</a>
              <a href="#" class="menu-item">我的课程包</a>
              <a href="#" class="menu-item">教师中心</a>
              <a href="#" class="menu-item">系统设置</a>
            </nav>

            <!-- 课程包树 -->
            <div class="nav-tree">
              <div class="nav-tree-inner">
                <div class="nav-tree-title">课程包</div>
                <div class="small muted" style="margin-bottom:8px; font-size:11px;">按年龄段与级别浏览</div>
                <div class="nav-tree-item">8–12 岁</div>
                <div class="nav-tree-sub">
                  <div class="nav-tree-sub-item active">L1</div>
                  <div class="nav-tree-sub-item">L2</div>
                </div>
                <div class="nav-tree-item inactive">6–7 岁</div>
              </div>
            </div>

            <div class="sidebar-copy">© 2024 AI Dash</div>
          </aside>

          <!-- ── 主区 ── -->
          <main class="main" style="display:flex; flex-direction:column;">

            <!-- 顶部导航栏 -->
            <div class="topbar-inner">
              <div class="topbar-tabs">
                <a href="list.html" class="topbar-tab active">课程包列表</a>
                <a href="#" class="topbar-tab">我的课程包</a>
                <a href="#" class="topbar-tab">教师中心</a>
                <a href="#" class="topbar-tab">系统设置</a>
              </div>
              <div class="small muted">张老师</div>
            </div>

            <!-- 页面头部 -->
            <div style="padding:22px 24px 10px 24px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;">
              <div>
                <div style="font-size:48px; line-height:1.05; font-weight:800; letter-spacing:-1px; margin-bottom:6px;">课程包列表</div>
                <div class="muted small">查看不同年龄段与级别下的课程包，并进入对应课程包详情。</div>
              </div>
              <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <input class="search-bar" placeholder="搜索课程包" />
                <div class="card-flat" style="height:44px; min-width:130px; padding:0 14px; border-radius:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; cursor:pointer;">
                  <span>学科类型</span><span style="color:var(--muted);">▾</span>
                </div>
              </div>
            </div>

            <!-- 卡片区 -->
            <div style="flex:1; padding:8px 24px 16px 24px;">
              <div style="background:rgba(255,255,255,0.52); border:1px solid var(--line); border-radius:22px; padding:18px; min-height:100%;">
                <div class="pkg-grid">

                  <!-- ★ 第一个课程包：真实内容 -->
                  <div class="pkg-card">
                    <div class="pkg-cover">
                      <img
                        src="assets/images/my-magical-partner-cover.png"
                        alt="我的神奇搭档课程包主图"
                      />
                    </div>
                    <div class="pkg-body">
                      <div class="pkg-title">我的神奇搭档课程包</div>
                      <div class="pkg-meta">
                        <div>● 适用年龄：8–12 岁</div>
                        <div>● 第 1 课《我的神奇搭档》</div>
                        <div>● 本课成果：《我的神奇搭档介绍页》</div>
                      </div>
                      <button class="btn pkg-enter-btn" onclick="window.location.href='detail.html'">进入详情</button>
                      <div class="pkg-tags">L1 ｜ 45 分钟 ｜ 4–6 人线下小班 ｜ 3 个 AI 回合 ｜ <span class="pill ok" style="font-size:11px; padding:3px 7px;">已按规范接入</span></div>
                    </div>
                  </div>

                  <!-- 占位课程包 2 -->
                  <div class="pkg-card">
                    <div class="pkg-cover">
                      <div class="pkg-cover-placeholder" style="background:linear-gradient(135deg,#f0f7ff,#e0f0ff);">
                        <span>课程主图</span>
                      </div>
                    </div>
                    <div class="pkg-body">
                      <div class="pkg-title">AI 表达力启航包</div>
                      <div class="pkg-tags muted">占位课程包</div>
                    </div>
                  </div>

                  <!-- 占位课程包 3 -->
                  <div class="pkg-card">
                    <div class="pkg-cover">
                      <div class="pkg-cover-placeholder" style="background:linear-gradient(135deg,#f1e8ff,#edf5ff);">
                        <span>课程主图</span>
                      </div>
                    </div>
                    <div class="pkg-body">
                      <div class="pkg-title">语文课程包</div>
                      <div class="pkg-tags muted">占位课程包</div>
                    </div>
                  </div>

                </div>
              </div>
            </div>

            <!-- 分页 -->
            <div class="pagination">
              <div class="page-num">1</div>
            </div>

          </main>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
